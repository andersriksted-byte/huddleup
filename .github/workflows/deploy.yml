name: Deploy til GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sæt Node op
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Installer afhængigheder
        run: npm ci

      - name: Byg projektet
        run: npm run build

      - name: Klargør GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build-output
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
